name: Smart Monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Run monitor
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python smart_monitor.py

      - name: Save price history
        if: always()
        run: |
          git config user.name "smart-monitor"
          git config user.email "bot@users.noreply.github.com"
          git add monitor.db
          git diff --cached --quiet || (git pull --rebase -q; git commit -m "update prices" && git push)
