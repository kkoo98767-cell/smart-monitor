name: Smart Monitor

on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 playwright

      - name: Cache browser
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Install browser
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium
          else
            playwright install --with-deps chromium
          fi

      - name: Run monitor
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python smart_monitor.py

      - name: Save price history
        if: always()
        run: |
          if [ -f monitor.db ]; then
            git config user.name "smart-monitor"
            git config user.email "bot@users.noreply.github.com"
            git add monitor.db
            git diff --cached --quiet || (git pull --rebase -q; git commit -m "update prices" && git push)
          fi
