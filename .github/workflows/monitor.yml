name: Smart Monitor

on:
  push:
    branches: [main]
    paths:
      - smart_monitor.py
      - monitor_history.py
      - test_monitor.py
      - .github/workflows/monitor.yml
  schedule:
    - cron: "7 5 * * *"  # 08:07 Asia/Riyadh
  workflow_dispatch:
    inputs:
      selftest:
        description: "اختبار المتاجر فقط — لا رسائل ولا حفظ لقاعدة الاختبار"
        type: boolean
        default: false
      telegram_check:
        description: "إرسال رسالة شغال للتأكد من الاتصال (يتجاهلها selftest)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: smart-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No cache: pip (no requirements.txt dependency).

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 playwright==1.65.2 curl_cffi==0.17.0

      - name: Syntax and regression tests
        run: |
          python -m py_compile smart_monitor.py monitor_history.py test_monitor.py
          python -m unittest -v test_monitor

      - name: Install browser fallback
        # Chrome is normally already on ubuntu-latest; bundled Chromium is fallback.
        run: |
          python -m playwright install --with-deps chromium
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Run monitor
        id: monitor
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SELFTEST: ${{ inputs.selftest || false }}
          TELEGRAM_CHECK: ${{ inputs.telegram_check || github.event_name == 'push' }}
        run: |
          args=()
          if [ "$SELFTEST" = "true" ]; then args+=(--selftest); fi
          if [ "$TELEGRAM_CHECK" = "true" ]; then args+=(--telegram-check); fi
          USE_XVFB=1 xvfb-run -a --server-args="-screen 0 1366x850x24" python -u smart_monitor.py "${args[@]}"

      - name: Save price history
        if: always() && steps.monitor.outcome != 'skipped' && inputs.selftest != true
        run: |
          if [ -f monitor.db ]; then
            git config user.name "smart-monitor"
            git config user.email "bot@users.noreply.github.com"
            git add monitor.db
            if git diff --cached --quiet; then
              echo "no changes to save"
              exit 0
            fi
            git commit -m "update prices"
            for i in 1 2 3 4; do
              if git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "saved on attempt $i"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "failed to save database"
            exit 1
          fi

      - name: Preserve report and database recovery copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            monitor_report.json
            monitor.db
          retention-days: 7
          if-no-files-found: warn
